name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v5

      - name: 🔌 SSH — Pull latest code
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            git pull origin main

      - name: 🐳 SSH — Build Docker images
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            docker compose -f docker-compose.prod.yml build

      - name: ⚙️ SSH — Cache config and routes
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            docker compose -f docker-compose.prod.yml run --rm laravel-api php artisan config:cache
            docker compose -f docker-compose.prod.yml run --rm laravel-api php artisan route:cache

      - name: 🗄️ SSH — Run database migrations
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            docker compose -f docker-compose.prod.yml run --rm laravel-api php artisan migrate --force

      - name: 🚀 SSH — Start containers
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      - name: ✅ Verify deployment health
        run: |
          echo "Waiting for app to start..."
          sleep 10
          curl -f https://propertyanalytics.naufaldev.cloud/api/health
