name: Weekly Docker Cleanup

on:
  schedule:
    - cron: '0 3 * * 0'  # 3AM UTC every Sunday = 11AM MYT
  workflow_dispatch:      # also lets you trigger it manually from the Actions tab

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: 🧹 SSH — Prune unused Docker build cache
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: appleboy/ssh-action@v1.0.3
          attempt_limit: 3
          attempt_delay: 10000
          with: |
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_SSH_KEY }}
            script: |
              echo "Disk usage before cleanup:"
              docker system df
              docker builder prune -a -f
              echo "Disk usage after cleanup:"
              docker system df
