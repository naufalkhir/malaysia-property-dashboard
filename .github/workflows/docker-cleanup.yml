name: Weekly Docker Cleanup

on:
  schedule:
    - cron: '0 3 * * 0'  # 3AM UTC every Sunday = 11AM MYT
  workflow_dispatch:      # also lets you trigger it manually from the Actions tab

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: 🔑 Set up SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: 🧹 SSH — Prune unused Docker build cache
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 10
          shell: bash
          command: |
            set -e
            ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o BatchMode=yes \
              -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE'
            echo "Disk usage before cleanup:"
            docker system df
            docker builder prune -a -f
            echo "Disk usage after cleanup:"
            docker system df
            REMOTE
