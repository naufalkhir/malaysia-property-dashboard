name: PR Checks

on:
    pull_request:
        branches: [ main ]

jobs:
    laravel-checks:
        runs-on: ubuntu-latest
        steps:
            - name: ⬇️ Checkout code
              uses: actions/checkout@v5

            - name: 🐘 Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"

            - name: 🎼 Install PHP dependencies
              run: cd laravel-api && composer install --no-interaction --no-progress

            - name: 🔑 Prepare testing .env
              run: cd laravel-api && cp .env.example .env && php artisan key:generate

            - name: 🖌️ PHP Pint code style
              run: cd laravel-api && ./vendor/bin/pint --test

            - name: 🧪 PHPUnit tests
              run: cd laravel-api && php artisan test

    python-checks:
        runs-on: ubuntu-latest
        steps:
            - name: ⬇️ Checkout code
              uses: actions/checkout@v5

            - name: 🐍 Install Ruff
              run: pip install ruff

            - name: 🔍 Ruff lint
              run: cd python-service && ruff check .

            - name: 🧪 Pytest
              run: cd python-service && pip install -r requirements.txt && pytest -q

    nuxt-checks:
        runs-on: ubuntu-latest
        steps:
            - name: ⬇️ Checkout code
              uses: actions/checkout@v5

            - name: 📦 Install dependencies
              run: cd nuxt-frontend && npm ci

            - name: 🏗️ Nuxt build check
              run: cd nuxt-frontend && npm run build
